name: Release

# Tag-driven release for this module. GitHub-hosted runners are
# acceptable here per .claude/rules/devops.md's non-deploy-bearing
# release-workflow carve-out: this job never SSHes to a deployment
# target and never runs docker compose against a running environment.
# It validates a tagged commit builds and tests clean, then publishes
# a GitHub release. There is no build artifact: this repo is a Go
# library, consumed via `go get`, not a deployable binary.
#
# Dry-run-safe by default per .claude/rules/releasing.md Section 1: a
# workflow_dispatch run with no input supplied defaults dry_run to
# true, so an accidental manual trigger rehearses the pipeline without
# creating a release. Only a real `v*` tag push, or an explicit
# dry_run=false dispatch, publishes.
#
# This workflow owns release.yml only. CI (build/test/lint) and
# CodeQL are Leon's lane in ci.yml and codeql.yml; this file does not
# touch or duplicate them, and this workflow does not re-run the full
# test suite beyond a final sanity build/test. Per releasing.md
# Section 7, the required pre-merge gates (tests, review, CVE scan)
# are the release's foundation and are assumed green on main before a
# tag is ever pushed.
#
# GOPRIVATE below is defensive, not required for this repo's own
# checkout: gridappsd-go is public and its only dependency
# (go-stomp/stomp) is public too. The wildcard guards against a
# *future* dependency on a sibling GRIDAPPSD module that is still
# private, so `go build`/`go test` do not silently try the public
# sumdb/proxy against a repo they cannot see. Remove this once no
# GRIDAPPSD-org dependency remains private, or narrow it the day one
# is added.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: rehearse the pipeline without publishing a release'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, test, resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_dry_run: ${{ steps.mode.outputs.is_dry_run }}
    env:
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git describe needs full tag history to resolve the pushed
          # tag (or the nearest ancestor tag on a workflow_dispatch
          # rehearsal off a branch).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine release mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        id: version
        run: |
          version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  publish:
    name: Publish GitHub release
    needs: build-and-verify
    if: needs.build-and-verify.outputs.is_dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate curated release notes
        # Convention: a release worth a hand-written narrative (a
        # breaking-change callout, a migration note, known-issue
        # disclosure) gets a file at .github/release-notes/<tag>.md,
        # committed on main before the tag is pushed. When no such
        # file exists, `gh release create` falls back to
        # --generate-notes (the auto-generated PR list), which is
        # enough for an ordinary patch release.
        id: notes
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          f=".github/release-notes/${REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "notes_file=$f" >> "$GITHUB_OUTPUT"
            echo "Using curated release notes: $f"
          else
            echo "notes_file=" >> "$GITHUB_OUTPUT"
            echo "No curated notes file at $f; falling back to --generate-notes."
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          if [ -n "$NOTES_FILE" ]; then
            gh release create "$REF_NAME" --title "$REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$REF_NAME" --title "$REF_NAME" --generate-notes
          fi

  dry-run-report:
    name: Report dry-run result
    needs: build-and-verify
    if: needs.build-and-verify.outputs.is_dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Print what would have published
        run: |
          echo "Dry run: no release was published."
          echo "Resolved version: ${{ needs.build-and-verify.outputs.version }}"
          echo "A real release requires either a pushed v* tag, or a workflow_dispatch run with dry_run set to false."
